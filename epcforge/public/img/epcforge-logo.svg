<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon background -->
  <polygon points="75,20 135,55 135,125 75,160 15,125 15,55" 
           fill="url(#brandGrad)" opacity="0.12" stroke="url(#brandGrad)" stroke-width="3"/>

  <!-- Gear icon (simplified) -->
  <g transform="translate(75,90)">
    <!-- Outer gear teeth -->
    <path d="M0,-45 L6,-45 L7,-36 L9,-35 L17,-39 L20,-34 L13,-28 L14,-26 L22,-23 L23,-18 L15,-17
             L14,-15 L17,-8 L12,-5 L7,-10 L5,-9 L3,-17 L-3,-17 L-5,-9 L-7,-10 L-12,-5 L-17,-8
             L-14,-15 L-15,-17 L-23,-18 L-22,-23 L-14,-26 L-13,-28 L-20,-34 L-17,-39 L-9,-35
             L-7,-36 L-6,-45 Z"
          fill="url(#gearGrad)" opacity="0.25"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="22" fill="url(#gearGrad)" opacity="0.15"/>
    <circle cx="0" cy="0" r="14" fill="url(#gearGrad)" opacity="0.30"/>
    <circle cx="0" cy="0" r="6" fill="url(#gearGrad)" opacity="0.50"/>
    <!-- Center bolt -->
    <circle cx="0" cy="0" r="3" fill="#1a56db"/>
    <!-- Hexagon keyhole -->
    <polygon points="0,-3 2.6,-1.5 2.6,1.5 0,3 -2.6,1.5 -2.6,-1.5" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Text: EPCForge -->
  <text x="160" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" font-weight="700" fill="#1e293b" letter-spacing="1">
    EPC<tspan fill="url(#brandGrad)" font-weight="800">Forge</tspan>
  </text>

  <!-- Tagline -->
  <text x="162" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" fill="#64748b" font-weight="400" letter-spacing="3">
    ENGINEERING · PROCUREMENT · CONSTRUCTION
  </text>
</svg>