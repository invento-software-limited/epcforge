<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon background -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
           fill="url(#favGrad)" opacity="0.12" stroke="url(#favGrad)" stroke-width="2"/>

  <!-- Simplified forge icon: gear + hexagon -->
  <g transform="translate(32,32)">
    <!-- Gear ring -->
    <circle cx="0" cy="0" r="18" fill="url(#favGrad)" opacity="0.18"/>
    <circle cx="0" cy="0" r="12" fill="url(#favGrad)" opacity="0.30"/>
    <circle cx="0" cy="0" r="5" fill="url(#favGrad)" opacity="0.50"/>
    <!-- Center letter F -->
    <text x="0" y="3.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" 
          font-weight="800" fill="#1a56db" text-anchor="middle" dominant-baseline="central">F</text>
  </g>
</svg>